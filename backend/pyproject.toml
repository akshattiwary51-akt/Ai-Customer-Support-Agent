[project]
name = "resolveai-support-backend"
version = "0.1.0"
description = "Production-style AI customer support backend with auth, RAG, tools, refunds, tickets, and analytics."
requires-python = ">=3.11"
dependencies = [
  "alembic==1.14.0",
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "sqlalchemy==2.0.36",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.1",
  "python-multipart==0.0.20",
  "PyJWT==2.10.1",
  "httpx==0.28.1",
  "email-validator==2.2.0",
  "psycopg[binary]==3.2.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "ruff==0.8.4",
]
documents = [
  "pypdf==5.1.0",
  "python-docx==1.1.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
